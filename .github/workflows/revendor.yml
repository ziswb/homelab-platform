---
# A Renovate PR that bumps a vendored component changes only its version; this
# rewrites the component on the PR with scripts/refresh-vendored.sh
# (scripts/revendor-pr.sh, ADR-0016), so the review sees the upstream diff.
#
# pull_request_target: the workflow and the scripts come from main, never from
# the PR; revendor-pr.sh refuses a PR that changes anything beyond the paths
# re-vendoring writes. CI and Gitleaks on the pushed commit wait for the
# maintainer's approval on the PR (ADR-0016).
name: Re-vendor

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  revendor:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Re-vendor the bumped components
        id: revendor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/revendor-pr.sh "$BASE_SHA" "$HEAD_REF" "$HEAD_SHA"

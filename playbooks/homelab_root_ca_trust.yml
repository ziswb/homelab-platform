---
# The k3s nodes trust the private root CA (roles/homelab_root_ca_trust). Run it
# before k3s_cluster: k3s's containerd reads the CA store only at start.
- name: Trust the private root CA on the k3s nodes
  hosts: server:agent
  become: true
  gather_facts: true
  roles:
    - role: ziswb.homelab_platform.homelab_root_ca_trust

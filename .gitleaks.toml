# gitleaks configuration: the default secret rules plus rules for site data.
#
# This repository is public; site specifics (hosts, network, location, accounts) live
# in a private infrastructure repo and reach the roles only as variables. Docs and
# examples use placeholders such as <domain>, <lan-host>, <tailnet>, or documentation
# values (RFC 5737 IPs, example.com). These rules catch the patterns. A private
# exact-value blocklist is checked by the local hooks (.githooks/).
title = "homelab-platform"

[extend]
useDefault = true

[[rules]]
id = "tailscale-key"
description = "Tailscale auth key, OAuth client secret or API key"
regex = '''tskey-(?:auth|client|api)-[A-Za-z0-9-]{10,}'''
keywords = ["tskey-"]

[[rules]]
id = "tailnet-name"
description = "Tailnet DNS name (use <tailnet>.ts.net)"
regex = '''(?i)\b[a-z0-9-]+\.ts\.net\b'''
keywords = [".ts.net"]
  [[rules.allowlists]]
  regexes = ['''(?i)^example\.ts\.net$''']

[[rules]]
id = "home-arpa-host"
description = "Host name under home.arpa (bare home.arpa is fine; use <lan-host>.<domain> or a variable)"
regex = '''(?i)\b[a-z0-9-]+\.home\.arpa\b'''
keywords = ["home.arpa"]

[[rules]]
id = "private-ipv4"
description = "Private or Tailscale IPv4 address (use an RFC 5737 address or <lan-ip>)"
regex = '''\b(?:192\.168|10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["192.168.", "10.", "172.", "100."]
  [[rules.allowlists]]
  description = "Kubernetes and container defaults (k3s cluster/service CIDRs), documentation placeholders"
  regexes = ['''^10\.(?:42|43)\.0\.\d{1,3}$''', '''^10\.0\.0\.\d{1,3}$''']

[[rules]]
id = "mac-address"
description = "MAC address (colon or hyphen separated)"
regex = '''\b(?:(?:[0-9A-Fa-f]{2}:){5}|(?:[0-9A-Fa-f]{2}-){5})[0-9A-Fa-f]{2}\b'''

[[rules]]
id = "tailscale-ipv6"
description = "Tailscale IPv6 address (fd7a:115c:a1e0::/48; use <lan-ip>)"
regex = '''(?i)\bfd7a:115c:a1e0:[0-9a-f:]+'''
keywords = ["fd7a:115c:a1e0"]

[[rules]]
id = "geo-coordinates"
description = "Latitude/longitude with three or more decimals"
regex = '''(?i)\b(?:lat|latitude|lon|lng|longitude)["']?\s*[:=]\s*["']?-?\d{1,3}\.\d{3,}'''
keywords = ["lat", "lon", "lng"]

[[rules]]
id = "fusionsolar-station-code"
description = "FusionSolar plant (station) code (a site value of the private infrastructure repo)"
regex = '''NE=\d{5,}'''
keywords = ["NE="]

[[rules]]
id = "personal-email"
description = "E-mail address (commits use the GitHub noreply address)"
regex = '''\b[A-Za-z0-9._%+-]+@[a-z0-9-]+(?:\.[a-z0-9-]+)*\.[a-z]{2,}\b'''
keywords = ["@"]
  [[rules.allowlists]]
  description = "noreply and documentation domains; Dependabot's sign-off (support@github.com)"
  regexes = ['''@users\.noreply\.github\.com$''', '''^noreply@anthropic\.com$''', '''^support@github\.com$''', '''@example\.(?:com|org|net)$''', '''@localhost$''']

[allowlist]
description = "Built collection tarballs and caches"
paths = [
  '''(?:^|/)ziswb-homelab_platform-[^/]*\.tar\.gz$''',
  '''(?:^|/)\.cache/''',
]

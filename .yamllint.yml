---
# yamllint settings compatible with ansible-lint's yaml rules.
extends: default

ignore: |
  .cache/
  .venv/

rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  line-length:
    max: 160
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  truthy:
    allowed-values: ["true", "false"]
    # GitHub workflows use the key `on:`.
    check-keys: false

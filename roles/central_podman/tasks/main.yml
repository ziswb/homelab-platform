---
# Single source of truth for installing Podman on the central host (Rocky Linux 10).
# Consumed via meta/main.yml by every central role that runs containers as Podman
# Quadlets (ADR-0008), in this collection (central_loki) and in a site's own
# roles. Ansible deduplicates a shared role dependency, so this runs once per play
# regardless of how many roles depend on it.
#
# Podman is daemonless: there is no service to enable. Containers are managed as
# systemd services generated from Quadlet units in /etc/containers/systemd/.
- name: Install Podman packages
  ansible.builtin.package:
    name:
      - podman
      - slirp4netns
    state: present
  become: true

# Netavark's firewall driver is pinned to nftables (ADR-0008, amended 0.4.1).
# Netavark 2.0 removed the iptables driver: with the old iptables pin, every
# Quadlet that publishes a port failed to start after the upgrade. Pinned rather
# than left at the default so that a later default change does not alter the
# ruleset unnoticed; firewalld is inactive on the reference host, so netavark's
# table is the only ruleset.
# A fresh Rocky 10 install of podman does not create the drop-in directory.
- name: Ensure the containers.conf drop-in directory exists
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true

- name: Configure netavark to use the nftables firewall driver
  ansible.builtin.copy:
    content: |
      [network]
      firewall_driver = "nftables"
    dest: /etc/containers/containers.conf.d/50-firewall-driver.conf
    owner: root
    group: root
    mode: '0644'
  become: true

---
argument_specs:
  main:
    short_description: The CloudNativePG operator
    description:
      - Installs the CloudNativePG operator chart in namespace C(cnpg-system) (CRDs kept when the release is removed) and waits until its webhook answers.
      - Database Clusters are the site's own.
    options:
      cnpg_operator_chart_version:
        type: str
        default: "0.29.1"
        description:
          - Version of the cloudnative-pg chart (0.29.1 = operator 1.30.1).
      helm_binary:
        type: str
        default: helm
        description:
          - The helm executable; default from the C(helm_preflight) dependency.

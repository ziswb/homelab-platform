---
# Re-arms the timer with the new start time. It is Persistent: if that time
# already passed today after its last run, it runs once right away.
- name: Restart dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: restarted
    daemon_reload: true
  become: true
  # In --check the package is not installed, so the unit does not exist.
  when: not ansible_check_mode

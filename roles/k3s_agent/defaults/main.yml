---
server_group: server  # noqa var-naming[no-role-prefix]
k3s_server_location: "/var/lib/rancher/k3s"  # noqa var-naming[no-role-prefix]
# /etc/rancher/k3s/config.yaml holds the cluster token (upstream default 0644).
k3s_agent_config_mode: "0600"
systemd_dir: "/etc/systemd/system"  # noqa var-naming[no-role-prefix]
api_port: 6443  # noqa var-naming[no-role-prefix]
extra_agent_args: "" # noqa var-naming[no-role-prefix]
extra_install_envs: {} # noqa var-naming[no-role-prefix]

# Registry mirrors for containerd, written to /etc/rancher/k3s/registries.yaml
# as its `mirrors` key (README "Registry mirrors" in roles/k3s_server). Shared
# by k3s_server and k3s_agent. Empty: no file is written.
k3s_registry_mirrors: {}  # noqa var-naming[no-role-prefix]

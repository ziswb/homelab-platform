---
- name: Apply pushgateway resources
  kubernetes.core.k8s:
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{ lookup('template', item) | from_yaml_all | list }}"
  loop:
    - pushgateway-deployment.yaml.j2
    - pushgateway-service.yaml.j2
    - pushgateway-service-monitor.yaml.j2

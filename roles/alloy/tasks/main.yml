---
- name: Ensure logging namespace is set up
  kubernetes.core.k8s:
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    state: present
    definition: "{{ lookup('template', item) | from_yaml_all | list }}"
  loop:
    - 00-alloy-ns.yaml.j2

- name: Ensure Alloy is set up
  kubernetes.core.k8s:
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    state: present
    definition: "{{ lookup('template', item) | from_yaml_all | list }}"
  loop:
    - 01-alloy-serviceaccount.yaml.j2
    - 02-alloy-clusterrole.yaml.j2
    - 03-alloy-clusterrolebinding.yaml.j2
    - 04-alloy-configmap.yaml.j2
    - 05-alloy-daemonset.yaml.j2

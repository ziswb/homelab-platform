---
# files/metallb-native.yaml is the upstream release, vendored (ADR-0012); its
# header names version and source. Replace it only with a new release file.
- name: Apply MetalLb manifest to the cluster.
  kubernetes.core.k8s:
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    state: present
    src: metallb-native.yaml

- name: Apply IP address pool manifest
  kubernetes.core.k8s:
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    state: present
    definition: "{{ lookup('template', 'metallb-ipaddresspool.yaml.j2') | from_yaml_all | list }}"

- name: Apply L2 advertisment manifest
  kubernetes.core.k8s:
    apply: true
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    state: present
    definition: "{{ lookup('template', 'metallb-l2advertisment.yaml.j2') | from_yaml_all | list }}"

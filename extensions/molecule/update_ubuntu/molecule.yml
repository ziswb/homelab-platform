---
# update_ubuntu needs a cluster for everything but its logic, and its node
# steps connect over SSH (docs/BACKLOG.md 4). This scenario tests the logic
# only: the node lookup by InternalIP (tasks/node_name.yml) and the choice of
# the CloudNativePG switchover target (tasks/cnpg_target.yml) on fixture
# k8s_info results, and the health gate script
# (templates/cluster_health_gate.sh.j2) in the container against stub
# systemctl, k3s and journalctl. The checks run in converge (facts do not
# carry over to a separate verify run).
driver:
  name: docker
platforms:
  - name: node
    image: homelab-platform-test/ubuntu2404:local
    pre_build_image: true
    # Keep the image's CMD (systemd as PID 1); the driver's default is a sleep loop.
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - server
provisioner:
  name: ansible
# No dependency install into ~/.ansible before a run: the collections come from
# ANSIBLE_COLLECTIONS_PATH (CI and the README's local steps install them).
prerun: false
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - destroy

---
# What a real host has before the role: sshd running and the login user.
- name: Prepare
  hosts: all
  gather_facts: true
  tasks:
    - name: Install the SSH server
      ansible.builtin.package:
        name: openssh-server
        state: present

    - name: Start the SSH server
      ansible.builtin.systemd_service:
        name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        state: started
        enabled: true

    - name: Create the login user
      ansible.builtin.user:
        name: tester
        shell: /bin/bash

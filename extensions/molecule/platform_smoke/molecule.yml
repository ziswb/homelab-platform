---
# Smoke test for the Molecule setup itself: both test images boot systemd and
# report the expected OS. Role scenarios copy this platform block (one image or
# both, by the hosts the role targets).
driver:
  name: docker
platforms:
  - name: node
    image: homelab-platform-test/ubuntu2404:local
    pre_build_image: true
    # Keep the image's CMD (systemd as PID 1); the driver's default is a sleep loop.
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - server
  - name: central
    image: homelab-platform-test/rocky10:local
    pre_build_image: true
    # Keep the image's CMD (systemd as PID 1); the driver's default is a sleep loop.
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - central_server
provisioner:
  name: ansible
# No dependency install into ~/.ansible before a run: the collections come from
# ANSIBLE_COLLECTIONS_PATH (CI and the README's local steps install them).
prerun: false
scenario:
  test_sequence:
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
